name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查（不装 playwright，只 node --check）
        run: |
          node --check common.mjs
          node --check renew.mjs
          node --check power.mjs
          node --check proxy_helper.mjs
          python3 -m py_compile node_proxy.py proxy_bootstrap.py
      - name: 单元测试
        run: node --test test/common.test.mjs
